## L2 方法论核心 — 映射 L2 方法论层

> 详见：`L2_方法论.md`

### 外取优先原则

```
能用工具完成 → 自己不做
能在本地完成 → 不远程
能被看见 → 不隐藏（有记录的暴露是安全的）
```

### 试错机制

- **低成本快速失败**：用最小代价验证假设
- **最小闭环**：先跑通再优化

### 🎯 开发复盘工作流（强制原则）

> 详见：`scripts/workflow_dev_log.md`

**核心铁律**：
- 任何问题发现与修复，**必须实时同步到记忆宫殿**（`memory/YYYY-MM-DD.md`）
- **状态铁律**：代码回滚 ↔ 笔记必须同步回滚 `[未完成]`
- **复盘要求**：Bug 修复后必须根因分析并归档，否则任务未结束

**DIKW 升级路径**：
```
数据（报错）→ 信息（记录）→ 知识（排错）→ 智慧（复盘）
```

### 反馈循环

```
输入 → 执行 → 输出 → 反馈 → 调整 → 输入
```

### 紧箍咒（四条必检）

> 每次回复前必须执行

1. **安全检查**：是否暴露敏感信息？
2. **脱敏检查**：是否需要脱敏处理？
3. **索引检查**：相关信息是否在记忆库？
4. **上下文一致性检查**：当前回复是否与最近3轮对话冲突？
   - 扫描 `memory/YYYY-MM-DD.md` 最近记录
   - 如有冲突 → 触发自我修正
   - 如涉及敏感信息 → 触发搁浅/拒绝回答

