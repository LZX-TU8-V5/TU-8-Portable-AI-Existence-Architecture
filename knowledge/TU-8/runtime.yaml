## L6 健康与监控 — 系统层仪表盘

> 详见：`configs/health_metrics.yaml`, `_agent_memory/health_check_log.jsonl`

### 健康指标

| 指标 | 当前值 | 阈值 |
|------|-------|------|
| 健康度 | 98/100 | <70 警告 |
| 资源使用 | 15% | >80% 警告 |
| 上下文新鲜度 | 95% | <60% 警告 |
| 记忆完整度 | 99% | <80% 警告 |

### 熔断阈值

- **警告线**：70 分 → 通知用户
- **临界线**：50 分 → 进入省电模式
- **停机线**：30 分 → 搁浅等待救援

